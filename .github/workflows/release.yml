name: Release

# Every push to main that touches code produces a new version, a git tag, and a GitHub release.
#
# Why this cannot loop:
#   1. Nothing is committed back to main. The version exists only as the git tag this workflow creates,
#      and the next version is computed from that tag (scripts/next-version.ps1).
#   2. This workflow listens to pushes on the main *branch* only; tag pushes never match `branches`.
#   3. Tags and releases created with the built-in GITHUB_TOKEN do not trigger workflow runs at all
#      (GitHub prevents recursive runs by design).
#   4. If HEAD is already tagged (e.g. a manual re-run), the release steps are skipped.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - '.github/workflows/ci.yml'
      - '.editorconfig'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history + tags, needed to compute the next version

      - name: Compute version
        id: version
        shell: pwsh
        run: ./scripts/next-version.ps1 -Bump '${{ inputs.bump || 'auto' }}'

      - name: Build
        if: steps.version.outputs.release == 'true'
        shell: cmd
        run: build.bat ${{ steps.version.outputs.version }}

      - name: Install Inno Setup
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Package
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: ./scripts/package.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $notes = @"
          ## Download

          | File | What it is |
          |---|---|
          | ``BrightKeys-$env:VERSION-setup-x64.exe`` | Installer (no admin rights needed) |
          | ``BrightKeys-$env:VERSION-portable-x64.zip`` | Portable: unzip anywhere and run ``BrightKeys.exe`` |
          | ``SHA256SUMS.txt`` | Checksums |

          Requires Windows 10 or 11 and a monitor with DDC/CI enabled in its on-screen menu.
          "@
          gh release create $env:TAG (Get-ChildItem dist -File).FullName `
            --target $env:GITHUB_SHA `
            --title "BrightKeys $env:VERSION" `
            --notes $notes `
            --generate-notes
