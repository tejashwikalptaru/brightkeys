name: Release

# Every push to main that touches code produces a new version, a git tag, and a GitHub release.
#
# Why this cannot loop:
#   1. Nothing is committed back to main. The version exists only as the git tag this workflow creates,
#      and the next version is computed from that tag (scripts/next-version.ps1).
#   2. This workflow listens to pushes on the main *branch* only; tag pushes never match `branches`.
#   3. Tags and releases created with the built-in GITHUB_TOKEN do not trigger workflow runs at all
#      (GitHub prevents recursive runs by design).
#   4. If HEAD is already tagged (e.g. a manual re-run), the release steps are skipped.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - '.github/workflows/ci.yml'
      - '.editorconfig'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write       # create the tag and release
  id-token: write       # sign build provenance (Sigstore)
  attestations: write   # store build provenance

jobs:
  release:
    runs-on: windows-latest
    env:
      # Optional. Free key from virustotal.com; without it the VirusTotal step is skipped.
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history + tags, needed to compute the next version

      - name: Compute version
        id: version
        shell: pwsh
        run: ./scripts/next-version.ps1 -Bump '${{ inputs.bump || 'auto' }}'

      - name: Build
        if: steps.version.outputs.release == 'true'
        shell: cmd
        run: build.bat ${{ steps.version.outputs.version }}

      - name: Install Inno Setup
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Package
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: ./scripts/package.ps1 -Version ${{ steps.version.outputs.version }}

      # Gate: a detection fails the job, so nothing is published.
      - name: Scan with Microsoft Defender
        id: defender
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: ./scripts/scan-defender.ps1 -Path dist

      # Signed statement that these files were built by this workflow from this commit.
      # Verify with: gh attestation verify <file> -R tejashwikalptaru/brightkeys
      - name: Attest build provenance
        if: steps.version.outputs.release == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - name: Scan with VirusTotal
        id: virustotal
        if: steps.version.outputs.release == 'true' && env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ env.VT_API_KEY }}
          request_rate: 4   # free API tier: 4 requests per minute
          files: |
            dist/*.exe
            dist/*.zip

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          DEFENDER: ${{ steps.defender.outputs.summary }}
          VT_ANALYSIS: ${{ steps.virustotal.outputs.analysis }}
        run: |
          # VirusTotal output: "dist/file1=url1,dist/file2=url2"
          $vt = if ($env:VT_ANALYSIS) {
            ($env:VT_ANALYSIS -split ',' | ForEach-Object {
              $file, $url = $_ -split '=', 2
              "[$(Split-Path $file -Leaf)]($url)"
            }) -join ' · '
          } else { '_not configured for this release_' }
          $repo = $env:GITHUB_REPOSITORY
          $run = "$env:GITHUB_SERVER_URL/$repo/actions/runs/$env:GITHUB_RUN_ID"

          $notes = @"
          ## Download

          | File | What it is |
          |---|---|
          | ``BrightKeys-$env:VERSION-setup-x64.exe`` | Installer (no admin rights needed) |
          | ``BrightKeys-$env:VERSION-portable-x64.zip`` | Portable: unzip anywhere and run ``BrightKeys.exe`` |
          | ``SHA256SUMS.txt`` | Checksums |

          Requires Windows 10 or 11 and a monitor with DDC/CI enabled in its on-screen menu.

          ## Security

          - **Built in the open:** compiled from commit $env:GITHUB_SHA by [this GitHub Actions run]($run). No local builds.
          - **Microsoft Defender:** ✅ $env:DEFENDER, checked before publishing.
          - **VirusTotal (70+ engines):** $vt
          - **Build provenance:** signed with Sigstore. Verify a download with
            ``gh attestation verify BrightKeys-$env:VERSION-setup-x64.exe -R $repo``

          Windows SmartScreen may still show an "unrecognized app" prompt because the binaries are not code-signed.
          "@
          gh release create $env:TAG (Get-ChildItem dist -File).FullName `
            --target $env:GITHUB_SHA `
            --title "BrightKeys $env:VERSION" `
            --notes $notes `
            --generate-notes
